name: Deploy — OpenStack K8s

on:
  workflow_run:
    workflows: ["Build & Push images"]
    types: [completed]
    branches:
      - main
      - deployment/hybrid-openstack-azure-vercel
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit SHA to deploy (full or 7-char). Leave blank to use HEAD of selected ref."
        type: string
        required: false
      service:
        description: "Deploy only one service (leave blank for all 7)"
        type: choice
        required: false
        default: ""
        options:
          - ""
          - user-service
          - interview-service
          - training-service
          - mentorship-service
          - quiz-service
          - community-service
          - resource-service

concurrency:
  group: deploy-k8s-prod
  cancel-in-progress: false       # never kill a rollout mid-flight

permissions:
  contents: read

env:
  NAMESPACE: piclouddoom
  REGISTRY_NS: docker.io/azizbna
  IMAGE_PREFIX: pi-clouddoom

jobs:
  # ─── Gate: only run if the upstream build succeeded ─────────────────────
  gate:
    name: precheck
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success')
    outputs:
      sha:       ${{ steps.resolve.outputs.sha }}
      sha_short: ${{ steps.resolve.outputs.sha_short }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - id: resolve
        name: Resolve commit SHA
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            sha="${{ github.event.workflow_run.head_sha }}"
          elif [ -n "${{ inputs.sha }}" ]; then
            sha="${{ inputs.sha }}"
          else
            sha="${{ github.sha }}"
          fi
          short="${sha:0:7}"
          echo "sha=$sha"           >> "$GITHUB_OUTPUT"
          echo "sha_short=$short"   >> "$GITHUB_OUTPUT"
          echo "Deploying tag: sha-$short"

  # ─── Rolling update each Spring service ─────────────────────────────────
  deploy:
    name: rollout-${{ matrix.service }}
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://api.interviewprep-tn.me
    strategy:
      fail-fast: false
      matrix:
        service:
          - user-service
          - interview-service
          - training-service
          - mentorship-service
          - quiz-service
          - community-service
          - resource-service
    steps:
      - name: Skip if single-service dispatch and not matched
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.service != '' && inputs.service != matrix.service }}
        run: |
          echo "Skipped: dispatch targeted '${{ inputs.service }}', this job is '${{ matrix.service }}'."
          exit 0

      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.29.15"        # match cluster version

      - name: Configure kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBECONFIG_PROD }}" > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          kubectl config current-context
          kubectl -n "${NAMESPACE}" get deploy "${{ matrix.service }}"

      - name: Set image to sha-${{ needs.gate.outputs.sha_short }}
        id: setimg
        run: |
          IMAGE="${REGISTRY_NS}/${IMAGE_PREFIX}-${{ matrix.service }}:sha-${{ needs.gate.outputs.sha_short }}"
          echo "Pinning ${{ matrix.service }} → ${IMAGE}"
          kubectl -n "${NAMESPACE}" set image \
            "deployment/${{ matrix.service }}" \
            "${{ matrix.service }}=${IMAGE}" \
            --record=false
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Wait for rollout
        id: rollout
        run: |
          set +e
          kubectl -n "${NAMESPACE}" rollout status \
            "deployment/${{ matrix.service }}" \
            --timeout=5m
          rc=$?
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" -ne 0 ]; then
            echo "::warning::Rollout did not converge in 5 minutes — collecting diagnostics."
            kubectl -n "${NAMESPACE}" describe "deployment/${{ matrix.service }}" || true
            kubectl -n "${NAMESPACE}" get pods -l app=${{ matrix.service }} -o wide || true
            kubectl -n "${NAMESPACE}" logs --tail=80 -l app=${{ matrix.service }} || true
          fi
          exit $rc

      - name: Auto-rollback on failure
        if: failure() && steps.setimg.outcome == 'success'
        run: |
          echo "::error::Rollout failed — rolling back ${{ matrix.service }} to previous revision."
          kubectl -n "${NAMESPACE}" rollout undo "deployment/${{ matrix.service }}"
          kubectl -n "${NAMESPACE}" rollout status "deployment/${{ matrix.service }}" --timeout=3m || true

      - name: Deploy summary
        if: always()
        run: |
          {
            echo "## ${{ matrix.service }}"
            echo "- Image pinned: \`${{ steps.setimg.outputs.image }}\`"
            echo "- Rollout exit code: \`${{ steps.rollout.outputs.rc }}\`"
            echo "- Pods now:"
            echo '```'
            kubectl -n "${NAMESPACE}" get pods -l app=${{ matrix.service }} -o wide 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ─── Aggregate gate ─────────────────────────────────────────────────────
  deploy-summary:
    name: deploy-summary
    runs-on: ubuntu-latest
    needs: deploy
    if: always()
    steps:
      - name: Check matrix outcome
        run: |
          result='${{ needs.deploy.result }}'
          echo "Matrix result: $result"
          [ "$result" = "failure" ] && exit 1 || echo "All deploys converged."
