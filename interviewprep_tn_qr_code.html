
<div style="display:flex;flex-direction:column;align-items:center;padding:2rem 1rem;gap:1.5rem">
  <div style="background:#0D9488;padding:1.5rem;border-radius:16px;display:flex;flex-direction:column;align-items:center;gap:1rem">
    <canvas id="qr" style="border-radius:8px;display:block"></canvas>
    <div style="color:#ECFDF5;font-size:13px;font-weight:500;letter-spacing:0.02em;text-align:center">www.interviewprep-tn.me</div>
  </div>
  <button onclick="dl()" style="background:#0D9488;color:white;border:none;padding:0.6rem 1.4rem;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer">Download PNG</button>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const url = "https://www.interviewprep-tn.me";
const size = 240;
new QRCode(document.getElementById("qr"), {
  text: url,
  width: size,
  height: size,
  colorDark: "#0D9488",
  colorLight: "#ECFDF5",
  correctLevel: QRCode.CorrectLevel.H
});
function dl() {
  const c = document.getElementById("qr").querySelector("canvas");
  const a = document.createElement("a");
  a.download = "interviewprep-tn-qr.png";
  a.href = c.toDataURL("image/png");
  a.click();
}
</script>
