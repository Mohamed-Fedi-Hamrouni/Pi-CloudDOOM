server:
    port: 8081

spring:
    application:
        name: user-service

    security:
        oauth2:
            resourceserver:
                jwt:
                    issuer-uri: http://localhost:8080/realms/myapp-realm
                    jwk-set-uri: http://localhost:8080/realms/myapp-realm/protocol/openid-connect/certs

    datasource:
        url: jdbc:postgresql://localhost:5432/userdb
        username: postgres
        password: "0000"
        driver-class-name: org.postgresql.Driver

    jpa:
        hibernate:
            ddl-auto: none
        show-sql: true
        properties:
            hibernate:
                dialect: org.hibernate.dialect.PostgreSQLDialect
                format_sql: true

    data:
        redis:
            host: localhost
            port: 6379
            password: "0000"

keycloak:
    server-url: http://localhost:8080
    realm: myapp-realm
    client-id: user-service
    client-secret: user-service-secret-change-in-prod

management:
    endpoints:
        web:
            exposure:
                include: health,info
    endpoint:
        health:
            show-details: always
